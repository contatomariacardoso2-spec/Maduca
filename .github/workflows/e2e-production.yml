name: Production E2E

on:
  push:
    branches: [main]
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/e2e-production.yml"
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare full production journey
        run: |
          sed -i '/Maduca E2E/d' e2e/production-authenticated.spec.ts
          sed -i 's/\.check();/.click();/' e2e/production-authenticated.spec.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path("e2e/production-authenticated.spec.ts")
          s = p.read_text()
          marker = '  await page.getByRole("button", { name: "Sair" }).click();'
          extra = r'''
  await page.getByRole("button", { name: "Portfólio" }).click();
  await page.getByPlaceholder("Título da peça").fill("E2E Upload");
  await page.locator('input[type="file"]').setInputFiles({
    name: "e2e.png",
    mimeType: "image/png",
    buffer: Buffer.from(
      "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=",
      "base64",
    ),
  });
  await page.getByRole("button", { name: "Enviar" }).click();
  await expect(page.getByText("Arquivo enviado para o storage privado.")).toBeVisible({
    timeout: 20_000,
  });
  await expect(page.getByText("E2E Upload")).toBeVisible();

  await page.getByRole("button", { name: "Estúdio" }).click();
  const brief = page.getByPlaceholder(/Cole aqui o briefing/i);
  await brief.fill(
    "Criar um vídeo UGC vertical de 30 segundos para um hidratante. A marca não informou claims clínicos, direitos de mídia paga, exclusividade, raw files ou autorização de portfólio.",
  );
  const aiButton = page.getByRole("button", { name: /Criar plano com IA/ });
  await aiButton.click();
  await expect(aiButton).not.toContainText("Organizando", { timeout: 90_000 });
  const bodyAfterAi = await page.locator("body").innerText();
  const aiWorked = bodyAfterAi.includes("ROTEIRO") && bodyAfterAi.includes("SHOT LIST");
  const aiNotConfigured = bodyAfterAi.includes("AI Gateway ainda não foi configurado");
  console.log("MADUCA_AI_RESULT=" + (aiWorked ? "generated" : aiNotConfigured ? "not_configured" : "unexpected"));
  expect(aiWorked || aiNotConfigured).toBeTruthy();

'''
          if marker not in s:
              raise SystemExit("logout marker not found")
          s = s.replace(marker, extra + marker, 1)
          p.write_text(s)
          PY
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://maduca.vercel.app
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

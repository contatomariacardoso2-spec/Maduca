name: Dependency lockfile check (manual)

# Antes este workflow modificava e enviava um commit extra para main,
# provocando build/deploy adicional. Agora apenas verifica sem escrever.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
